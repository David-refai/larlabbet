<title>Lärlabbet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@600;700;800&family=Caveat:wght@600;700&family=Aref+Ruqaa:wght@700&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
/* Layout: a clean studio. One large "board" stage per lesson (always light, like a real whiteboard),
   the owl teacher talks beneath it, controls sit between. Page chrome follows the viewer's theme. */
:root{
  --bg:#f3f5fa; --surface:#ffffff; --ink:#13213f; --muted:#5d6b88; --line:#dde3ef;
  --accent:#ff7a45; --accent-deep:#d9592a; --teal:#14a39a; --blue:#4c6bff; --sun:#ffc93c; --good:#1f9d63; --bad:#e5484d;
  --shadow:0 1px 2px rgba(19,33,63,.06),0 8px 24px rgba(19,33,63,.08);
  --display:"Baloo Bhaijaan 2","Figtree",system-ui,sans-serif;
  --body:"Figtree","IBM Plex Sans Arabic",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1424; --surface:#162038; --ink:#eef2fb; --muted:#9aa7c4; --line:#27324f;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1424; --surface:#162038; --ink:#eef2fb; --muted:#9aa7c4; --line:#27324f;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:16px;line-height:1.6}
.wrap{max-width:940px;margin:0 auto;padding-inline:16px;padding-block:12px 48px}
h1,h2,h3{font-family:var(--display);line-height:1.2;text-wrap:balance;margin:0;font-weight:800}
h1{font-size:2rem} h2{font-size:1.35rem} h3{font-size:1.1rem;font-weight:700}
p{margin:0}
button{font:inherit;cursor:pointer;color:inherit}
.muted{color:var(--muted)}
.label{font-size:.8rem;font-weight:600;color:var(--muted);letter-spacing:.03em}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{font-family:var(--display);font-weight:700;font-size:1.02rem;border:0;border-radius:12px;padding:8px 20px;background:var(--accent);color:#fff;box-shadow:0 3px 0 var(--accent-deep);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--accent-deep)}
.btn.ghost{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1.5px var(--line) inset,0 3px 0 var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:4px 16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;background:none;border:0;padding:0;font-family:var(--display);font-weight:800;font-size:1.35rem}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{background:var(--surface);box-shadow:0 0 0 1.5px var(--line) inset;border-radius:999px;padding:3px 12px;font-weight:600;font-size:.88rem;white-space:nowrap;font-variant-numeric:tabular-nums}
button.chip{border:0;cursor:pointer;color:var(--ink)}button.chip:hover{box-shadow:0 0 0 2px var(--blue) inset}
.langs{display:flex;background:var(--surface);box-shadow:0 0 0 1.5px var(--line) inset;border-radius:999px;padding:3px}
.langs button{border:0;background:none;border-radius:999px;padding:2px 10px;font-weight:700;font-size:.85rem;color:var(--muted)}
.langs button[aria-pressed=true]{background:var(--ink);color:var(--bg)}

.hello{display:grid;grid-template-columns:140px 1fr;gap:24px;align-items:center;background:var(--surface);border-radius:24px;padding:24px;box-shadow:var(--shadow)}
.panel{background:var(--surface);border-radius:24px;padding:24px;box-shadow:var(--shadow)}
.grades{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.grades button{border:0;box-shadow:0 0 0 1.5px var(--line) inset;border-radius:12px;padding:8px 0;background:var(--bg);font-family:var(--display);font-weight:700;font-size:1.15rem}
.grades button[aria-pressed=true]{background:var(--ink);color:var(--bg);box-shadow:none}
input[type=text]{font:inherit;width:100%;border:0;box-shadow:0 0 0 1.5px var(--line) inset;border-radius:12px;padding:10px 14px;background:var(--bg);color:var(--ink)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:0;background:transparent;border-radius:999px;padding:5px 16px;font-weight:700;color:var(--muted)}
.tab[aria-selected=true]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.tab .soon{font-size:.72rem;font-weight:600;margin-inline-start:6px;opacity:.8}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
.card{text-align:start;border:0;border-radius:20px;background:var(--surface);padding:0;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow);transition:transform .15s}
.card:hover{transform:translateY(-3px)}
.card .art{position:relative;aspect-ratio:16/9;display:grid;place-items:center;background:#f7f9fd;border-bottom:1px solid var(--line)}
.ord{position:absolute;top:10px;inset-inline-start:10px;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:var(--bg);font-family:var(--display);font-weight:800;font-size:1rem}
.ord.ok{background:var(--good,#1e9e5a)}
.course{display:flex;justify-content:space-between;align-items:end;gap:14px 24px;flex-wrap:wrap;background:var(--surface);border-radius:20px;padding:16px 20px;box-shadow:var(--shadow)}
.course h2{margin:0}.yseg{align-self:flex-start;margin-top:4px}.cprog{display:flex;flex-direction:column;gap:6px;min-width:200px;font-weight:700;font-size:.9rem}
.cprog i{display:block;height:10px;border-radius:999px;background:var(--line);overflow:hidden}.cprog b{display:block;height:100%;background:var(--teal)}
.card .art svg{width:100%;height:100%}
.card .meta{padding:14px 18px 18px;display:flex;flex-direction:column;gap:4px}
.stars{color:var(--sun);letter-spacing:2px;font-size:1.05rem}
.stars .off{color:var(--line)}
.empty{border:2px dashed var(--line);border-radius:20px;padding:28px;text-align:center;color:var(--muted)}

.lhead{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap}
.progress{display:flex;gap:5px}
.progress i{width:24px;height:6px;border-radius:999px;background:var(--line)}
.progress i.done{background:var(--teal)} .progress i.now{background:var(--accent)}
.stage{position:relative;width:100%;aspect-ratio:16/10;border-radius:20px;overflow:hidden;background:#fbfcff;box-shadow:var(--shadow);user-select:none;-webkit-user-select:none}
.stage svg,.stage canvas{display:block;width:100%;height:100%;touch-action:none}
.stage .msg{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:#13213f}
.ctrl{min-height:46px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;background:var(--surface);border-radius:14px;padding:8px 16px;box-shadow:var(--shadow);font-variant-numeric:tabular-nums}
.ctrl:empty{display:none}
.seg{display:flex;gap:4px;background:var(--bg);border-radius:999px;padding:3px}
.seg button{border:0;background:none;border-radius:999px;padding:3px 14px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.ctrl input[type=range]{accent-color:var(--accent);width:min(240px,100%)}
.pill{border-radius:999px;padding:2px 12px;font-weight:700;font-size:.9rem;color:#13213f}
.sum{font-family:var(--display);font-weight:700;font-size:1.2rem;display:flex;gap:8px;align-items:center;flex-wrap:wrap;direction:ltr}
.sum b{border-radius:8px;padding:0 8px;color:#fff;font-weight:700}
.big{font-family:var(--display);font-weight:700;font-size:1.15rem}
.teacher{display:grid;grid-template-columns:104px 1fr;gap:14px;align-items:end}
.avatar{width:104px;height:104px;overflow:visible}
.bubble{position:relative;background:var(--surface);border-radius:20px;border-end-start-radius:6px;padding:16px 22px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;border-inline-start:6px solid var(--teal)}
.bubble p{font-size:1.32rem;font-weight:600;line-height:1.55;color:var(--ink);min-height:3.2em;cursor:pointer}
.bubble p b.n{font-family:var(--display);font-weight:800;color:#2257c9;background:#e8efff;border-radius:6px;padding:0 5px;white-space:nowrap;direction:ltr;unicode-bidi:isolate}
.kbd{font-size:.8rem;color:var(--muted)}
.who{font-family:var(--display);font-weight:800;font-size:.85rem;color:var(--teal)}
.bubble>.row{justify-content:space-between}
.btn.helpb{background:#fff1c7;color:#7a4d00;box-shadow:none;padding:5px 14px}.btn.helpb:hover{background:#ffe59a}.btn.helpb:disabled{opacity:.45}
.btn.aib{background:#ece8ff;color:#4b2bb5;box-shadow:none;padding:5px 14px}.btn.aib:hover{background:#ddd5ff}
.aiwait{display:flex;gap:6px;padding:4px 0}.aiwait i{width:10px;height:10px;border-radius:50%;background:#7c5cff;animation:aiw 1s infinite alternate}.aiwait i:nth-child(2){animation-delay:.2s}.aiwait i:nth-child(3){animation-delay:.4s}
@keyframes aiw{to{opacity:.2;transform:translateY(-4px)}}
.aiq{flex-wrap:nowrap}.aiq input{flex:1;min-width:0}
.task{font-size:.86rem;font-weight:700;color:#7a4d00;background:#fff1c7;border-radius:999px;padding:3px 12px}
.task.ok{color:#0d5c39;background:#d5f5e3}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.opt{text-align:start;border:0;box-shadow:0 0 0 1.5px var(--line) inset;background:var(--bg);border-radius:12px;padding:9px 14px;font-weight:600}
.opt:hover:not(:disabled){box-shadow:0 0 0 2px var(--blue) inset}
.opt.right{background:var(--good);color:#fff;box-shadow:none}
.opt.wrong{background:var(--bad);color:#fff;box-shadow:none}
.voice{font-size:.85rem;display:flex;gap:6px;align-items:center;color:var(--muted)}

/* owl */
.avatar .bob{animation:bob 3.2s ease-in-out infinite;transform-origin:60px 110px}
.avatar .lids{transform-origin:60px 54px;transform:scaleY(0);animation:blink 4.5s infinite}
.avatar .jaw{transform-origin:60px 70px;transition:transform .1s}
.avatar.talking .jaw{animation:jaw .2s infinite alternate}
.avatar .wl{transform-origin:28px 66px} .avatar .wr{transform-origin:92px 66px}
.avatar.happy .wl{animation:flapL .35s 3 alternate} .avatar.happy .wr{animation:flapR .35s 3 alternate}
@keyframes bob{50%{transform:translateY(-3px)}}
@keyframes blink{0%,93%,100%{transform:scaleY(0)}96%{transform:scaleY(1)}}
@keyframes jaw{to{transform:translateY(3px)}}
@keyframes flapL{to{transform:rotate(25deg)}} @keyframes flapR{to{transform:rotate(-25deg)}}

/* board scene helpers */
.board text{font-family:"Baloo Bhaijaan 2","Figtree",sans-serif;font-weight:700;paint-order:stroke;stroke:#fbfcff;stroke-width:5px;stroke-linejoin:round}
.board .pilltxt{stroke:none;font-family:"Figtree","IBM Plex Sans Arabic",sans-serif;font-weight:700}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .6s var(--d,0s) ease-out forwards}
.fillin{opacity:0;animation:fadein .5s var(--d,0s) forwards}
.hint{animation:hint 1.1s ease-in-out infinite}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fadein{to{opacity:1}}
@keyframes hint{50%{opacity:.25}}
.stage.wbframe{border:9px solid #d3d9e3;box-shadow:0 0 0 1px #b9c1ce,var(--shadow);cursor:pointer}
.answer{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.answer input{font-family:var(--display);font-weight:700;font-size:1.4rem;width:5.5em;text-align:center;border:0;box-shadow:0 0 0 2px var(--line) inset;border-radius:10px;padding:4px 8px;background:var(--bg);color:var(--ink)}
.pairin{display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap}.pairin input{width:3.6em}.pairin b{font-size:1.6rem}.pairin label{font-weight:700;color:var(--muted)}
.answer .ch{font-size:1.15rem;min-width:4em}
.fracin{display:inline-flex;flex-direction:column;align-items:center;gap:4px}
.fracin input{width:3.2em}.fracin i{display:block;width:3.6em;height:3px;border-radius:2px;background:var(--ink)}
.toast{position:fixed;inset-inline:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));max-width:420px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 16px;font-family:var(--display);font-weight:800;font-size:1.05rem;text-align:center;z-index:9;box-shadow:var(--shadow)}

.hero{display:grid;grid-template-columns:110px 1fr;gap:18px;align-items:center;background:linear-gradient(135deg,#fff6e0,#ffe9dc);color:#13213f;border-radius:24px;padding:20px 24px;box-shadow:var(--shadow)}
.hero .avatar{width:110px;height:110px}.hero p{color:#3d4a66}
.tools3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.tool{display:flex;gap:12px;align-items:flex-start;text-align:start;border:0;border-radius:18px;background:var(--surface);padding:14px 16px;box-shadow:var(--shadow);transition:transform .15s}
.tool:hover{transform:translateY(-2px)}.tool>span:last-child{display:flex;flex-direction:column;gap:2px;min-width:0}.tool b{font-family:var(--display);font-size:1.08rem}
.tool .muted{font-size:.86rem;line-height:1.35}.tool.dim{opacity:.62}.ti{font-size:1.9rem;line-height:1}
.streak{font-weight:800;font-size:.86rem;color:#c2410c}.cnt{display:inline-block;min-width:1.5em;text-align:center;border-radius:999px;background:var(--accent);color:#fff;font-size:.8rem;padding:0 6px;vertical-align:2px}
.bmini{font-size:1.05rem;letter-spacing:2px}
.ord.kn{background:var(--teal)}.kntag{color:var(--teal);font-weight:800;font-size:.9rem;line-height:1.7}
.card.here{box-shadow:0 0 0 3px var(--accent),var(--shadow)}
.ribbon{position:absolute;top:10px;inset-inline-end:10px;background:var(--accent);color:#fff;border-radius:999px;padding:2px 12px;font-family:var(--display);font-weight:800;font-size:.85rem}
.bpop{position:fixed;inset:0;display:grid;place-items:center;background:rgba(13,20,36,.35);z-index:10;cursor:pointer}
.bpop[hidden]{display:none}
.bcard{background:var(--surface);color:var(--ink);border-radius:24px;padding:26px 40px;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:var(--shadow);animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
.bcard b{font-family:var(--display);font-size:1.4rem}.bcard .bico{font-size:3.6rem;line-height:1.1}
@keyframes pop{from{transform:scale(.4);opacity:0}}
.bgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.badge{background:var(--surface);border-radius:18px;padding:18px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;box-shadow:var(--shadow)}
.badge .bico{font-size:2.6rem;line-height:1.2}.badge b{font-family:var(--display);font-size:1.08rem}.badge .muted{font-size:.88rem;line-height:1.35}
.badge.off .bico{filter:grayscale(1);opacity:.35}.badge.off b{color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.tile{background:var(--surface);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:2px}
.tile b{font-family:var(--display);font-size:1.7rem;font-weight:800;font-variant-numeric:tabular-nums}.tile .muted{font-size:.85rem}
.pchart{width:100%;height:auto;max-height:240px}.pchart .cv{font:700 15px var(--body);fill:var(--ink)}.pchart .cx{font:600 13px var(--body);fill:var(--muted)}
.pchart g:hover path{opacity:.8}
.plist{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:4px}
.ptable{overflow-x:auto}.ptable table{width:100%;border-collapse:collapse;font-size:.95rem}
.ptable th{text-align:start;font-size:.8rem;color:var(--muted);font-weight:600;padding:6px 8px;border-bottom:1.5px solid var(--line)}
.ptable td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}.ptable td:first-child{font-weight:800;color:var(--muted)}
.st{font-size:.78rem;font-weight:700;border-radius:999px;padding:0 8px}.st.done{background:#d5f5e3;color:#0d5c39}.st.known{background:#d4f1ee;color:#0b5f59}.st.started{background:#fff1c7;color:#7a4d00}.st.none{color:var(--muted)}
@media (max-width:760px){.bgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.tools3{grid-template-columns:1fr}.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:620px){
  .hello{grid-template-columns:1fr;padding:18px}.hello .avatar{width:84px;height:84px}
  .teacher{grid-template-columns:60px 1fr}.teacher .avatar{width:60px;height:60px}.bubble p{font-size:1.14rem}.bubble{padding:14px 16px}
  .hero{grid-template-columns:1fr;padding:18px}.hero .avatar{width:72px;height:72px}.opts{grid-template-columns:1fr} h1{font-size:1.6rem}.grades{grid-template-columns:repeat(3,1fr)}.panel{padding:18px}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important;transition:none!important}}
</style>

<div class="wrap" id="wrap">
  <header class="top">
    <button class="brand" id="home"><svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="15" fill="#13213f"/><path d="M9 22l7-13 7 13z" fill="none" stroke="#ffc93c" stroke-width="2.4" stroke-linejoin="round"/><circle cx="16" cy="18" r="2.4" fill="#ff7a45"/></svg><span id="brandname">Lärlabbet</span></button>

/* column addition, drawn step by step with carries and side notes */
function vAdd(a,b,top=0){
 const s=a+b,n=String(s).length,R0=430,CW=74,cx=j=>R0-j*CW,COL=["r","b","g"];
 const HDR={sv:["E","T","H"],en:["O","T","H"],ar:["آ","ع","م"]}[lang];
 const y={hdr:105+top,carry:142+top,a:200+top,b:272+top,line:294+top,s:368+top};
 const dg=(v,j)=>Math.floor(v/10**j)%10, la=String(a).length, lb=String(b).length;
 const out=[];
 for(let j=0;j<n;j++){out.push(A.band(cx(j)-32,y.hdr+14,64,y.s-y.hdr+12,COL[j]));out.push(A.tx(HDR[j],cx(j),y.hdr,32,COL[j]))}
 String(a).split("").reverse().forEach((d,j)=>out.push(A.tx(d,cx(j),y.a,66)));
 String(b).split("").reverse().forEach((d,j)=>out.push(A.tx(d,cx(j),y.b,66)));
 out.push(A.tx("+",cx(n-1)-58,y.b-4,58));
 out.push(A.p(R.line(cx(n-1)-82,y.line,cx(0)+38,y.line,.6),"k",4.5));
 let carry=0;
 for(let j=0;j<n;j++){
  if(j>=la&&j>=lb){out.push(A.tx(carry,cx(j),y.s,66,"g"));break}
  const t=dg(a,j)+dg(b,j)+carry;
  out.push(A.hl(cx(j)-30,y.a-56,60,y.b-y.a+72));
  out.push(A.tx(`${dg(a,j)} + ${dg(b,j)}${carry?" + 1":""} = ${t}`,650,y.a-20+j*62,36,COL[j]));
  out.push(A.tx(t%10,cx(j),y.s,66,"g"));
  carry=t>=10?1:0;
  if(carry&&(j+1<la||j+1<lb))out.push(A.tx("1",cx(j+1),y.carry,32,"r"));
 }
 out.push(A.loop((cx(0)+cx(n-1))/2,y.s-24,n*CW/2+22,44,"g"));
 return out;
}

function pvHead(y0=60,h=330){const o=[];PVX.forEach((x,i)=>o.push(A.band(x-72,y0,144,h,PVC[i]),A.tx(PVH()[i],x,y0+40,30,PVC[i])));o.push(A.p(R.line(80,y0+58,720,y0+58,.5),"k",3));return o}

 for(let i=0;i<p;i++)o.push(A.tx("=",PVX[i],350,44,"g"));

function nline(x1,x2,y,ticks,labels){let d=R.line(x1,y,x2,y,.4);for(let i=0;i<=ticks;i++){const x=x1+(x2-x1)*i/ticks,big=labels.some(l=>l[0]===i);d+=R.line(x,y-(big?17:9),x,y+(big?17:9),.2)}
 return[A.p(d,"k",3.5),...labels.map(([i,s])=>A.tx(s,x1+(x2-x1)*i/ticks,y-30,34))]}
function roundBoard(n,to,part=3,y=260){const lo=Math.floor(n/to)*to,hi=lo+to,r=n-lo>=to/2?hi:lo,x=100+600*(n-lo)/to,o=[];
 if(part&1)o.push(...nline(100,700,y,10,[[0,fmt(lo)],[10,fmt(hi)]]),A.p(dots([[x,y]]),"r",20),A.tx(fmt(n),x,y-78,42,"r"),A.arrow(x,y-68,x,y-24,"r"));
 if(part&2){const cl=(r===lo),dl=n-lo,dh=hi-n;
  o.push(A.arrow(x,y+24,100,y+24,cl?"g":"o",-Math.min(70,(x-100)*.35)),A.tx(fmt(dl),(x+100)/2,y+80+Math.min(35,(x-100)*.17),34,cl?"g":"o"));
  o.push(A.arrow(x,y+24,700,y+24,cl?"o":"g",Math.min(70,(700-x)*.35)),A.tx(fmt(dh),(x+700)/2,y+80+Math.min(35,(700-x)*.17),34,cl?"o":"g"));
  o.push(A.hl(230,412,340,64),A.tx(`${fmt(n)} ≈ ${fmt(r)}`,400,462,56,"g"))}
 return o}

/* ---------- 4. Subtraction with exchange ---------- */
function vSub(a,b,top=0){
 const n=String(a).length,R0=430,CW=74,cx=j=>R0-j*CW,COL=["r","b","g"];
 const HDR={sv:["E","T","H"],en:["O","T","H"],ar:["آ","ع","م"]}[lang];
 const y={hdr:105+top,carry:142+top,a:200+top,b:272+top,line:294+top,s:368+top};
 const t=String(a).split("").reverse().map(Number),bd=j=>Math.floor(b/10**j)%10,shownY=t.map(()=>y.a),out=[];
 for(let j=0;j<n;j++){out.push(A.band(cx(j)-32,y.hdr+14,64,y.s-y.hdr+12,COL[j]));out.push(A.tx(HDR[j],cx(j),y.hdr,32,COL[j]))}
 t.forEach((d,j)=>out.push(A.tx(d,cx(j),y.a,66)));
 String(b).split("").reverse().forEach((d,j)=>out.push(A.tx(d,cx(j),y.b,66)));
 out.push(A.tx("−",cx(n-1)-58,y.b-4,58));
 out.push(A.p(R.line(cx(n-1)-82,y.line,cx(0)+38,y.line,.6),"k",4.5));
 let row=0;
 for(let j=0;j<n;j++){
  const sub=bd(j);
  if(j===n-1&&j>0&&t[j]-sub===0&&b<10**j)break;
  out.push(A.hl(cx(j)-30,y.a-56,60,y.b-y.a+72));
  if(t[j]<sub){const k=j+1,yk=shownY[k];
   out.push(A.p(R.line(cx(k)-20,yk+4,cx(k)+22,yk-52,.4),"r",4));
   t[k]-=1;shownY[k]=y.carry;out.push(A.tx(t[k],cx(k)+4,y.carry,34,"r"));
   out.push(A.tx("1",cx(j)-(shownY[j]===y.a?30:18),shownY[j]===y.a?y.a-34:y.carry,shownY[j]===y.a?34:34,"r"));t[j]+=10}
  const r=t[j]-sub;
  out.push(A.tx(`${t[j]} − ${sub} = ${r}`,650,y.a-20+row*62,36,COL[j]));row++;
  if(!(j===n-1&&j>0&&r===0))out.push(A.tx(r,cx(j),y.s,66,"g"));
 }
 const res=a-b,m=String(res).length;
 out.push(A.loop((cx(0)+cx(m-1))/2,y.s-24,m*CW/2+22,44,"g"));
 return out;
}

  for(let j=0;j<k;j++)(i<g?pts:left).push([cx-(cols-1)*gap/2+(j%cols)*gap,y0+90-(rows-1)*gap/2+Math.floor(j/cols)*gap])}

 mount(stage,ctrl,api){

    parts.push({x:hx,y:hy,hx,hy,hth,th:hth,om:0,vx:0,vy:0})}
  const STATE={sv:["Fast: is","Flytande: vatten","Gas: ånga"],en:["Solid: ice","Liquid: water","Gas: steam"],ar:["صلب: جليد","سائل: ماء","غاز: بخار"]}[lang];

  function check(){if(doneFor===cur)return;if(phase()===2)sawGas=true;

  function tick(){const p=phase();

      else{const kick=p===1?.45+T*.01:.5;a.vx+=rnd(-kick,kick);a.vy+=rnd(-kick,kick);

        a.th+=a.om;a.x+=a.vx;a.y+=a.vy;const e=p===2?1:.4;

        if(a.y<box.y+R){a.y=box.y+R;a.vy=Math.abs(a.vy)*e}if(a.y>box.y+box.h-R){a.y=box.y+box.h-R;a.vy=-Math.abs(a.vy)*e}}}
    if(p>0)for(let i=0;i<N;i++)for(let j=i+1;j<N;j++){const a=parts[i],b=parts[j],dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy);
      if(d<2*R&&d>0){const o=(2*R-d)/2,ux=dx/d,uy=dy/d;a.x-=ux*o;a.y-=uy*o;b.x+=ux*o;b.y+=uy*o}}

  function draw(p){

    if(T>40){ctx.save();ctx.globalAlpha=Math.min(.5,(T-40)/150);const gg=ctx.createRadialGradient(box.x+box.w/2,py,5,box.x+box.w/2,py,140);gg.addColorStop(0,"#ff7a3d");gg.addColorStop(1,"rgba(255,122,61,0)");ctx.fillStyle=gg;ctx.fillRect(box.x-60,py-140,box.w+120,150);ctx.restore()}

    ctx.beginPath();ctx.moveTo(box.x-12,box.y-18);ctx.lineTo(box.x-4,box.y-10);ctx.lineTo(box.x-4,box.y+box.h-10);ctx.quadraticCurveTo(box.x-4,box.y+box.h+6,box.x+12,box.y+box.h+6);

      for(let i=0;i<N;i++){const a=parts[i],c=i%COLS,r=Math.floor(i/COLS);const nb=[];if(c<COLS-1)nb.push(i+1);if(r<ROWS-1){nb.push(i+COLS);if(r%2===0&&c>0)nb.push(i+COLS-1);if(r%2===1&&c<COLS-1)nb.push(i+COLS+1)}
        nb.forEach(j=>{const b=parts[j];ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()})}ctx.restore()}

 o.push(A.tx(b,cx(0),Y.b,64),mSign(cx(n-1)-58,Y.b-22),A.p(R.line(cx(n-1)-82,Y.l,cx(0)+38,Y.l,.6),"k",4.5));

 o.push(mark(A.loop((cx(0)+cx(n-1))/2,Y.s-22,n*CW/2+24,44,"g"),"ans"));return o};

{

const fwid=(n,d,s)=>Math.max(String(n).length,String(d).length)*s*.42+s*.3;
const twid=(t,s)=>{t=String(t);return /[؀-ۿ]/.test(t)?t.length*s*.5+s*.2:t.length*s*.44};
const mwid=(w,n,d,s)=>String(w).length*s*.62+s*.22+fwid(n,d,s);
const mixed=(w,n,d,x,y,s,c="k")=>{const ww=String(w).length*s*.62,x0=x-mwid(w,n,d,s)/2;return[A.tx(w,x0+ww/2,y+s*.5,s*1.4,c),...A.frac(n,d,x0+ww+s*.22+fwid(n,d,s)/2,y,s,c)]};

const row=(items,cx,y,s,rtl=false)=>{const g=s*.3,ws=items.map(it=>it[0]==="f"?fwid(it[1],it[2],s):it[0]==="m"?mwid(it[1],it[2],it[3],s):twid(it[1],s));
 const tot=ws.reduce((a,b)=>a+b,0)+g*(items.length-1),ord=items.map((_,i)=>i);if(rtl&&lang==="ar")ord.reverse();
 let x=cx-tot/2;const pos=[];ord.forEach(i=>{pos[i]=x+ws[i]/2;x+=ws[i]+g});
 const out=items.map((it,i)=>it[0]==="f"?A.frac(it[1],it[2],pos[i],y,s,it[3]||"k"):it[0]==="m"?mixed(it[1],it[2],it[3],pos[i],y,s,it[4]||"k"):[A.tx(it[1],pos[i],y+s*.36,s,it[2]||"k")]);
 out.pos=pos;out.ws=ws;return out};

 return{L:[...r[0],...r[1]],R:r[2],x:r.pos[2],w:r.ws[2],AR:[A.arrow(x1,yt,x2,yt,"r",-s*.42),A.tx(lab,cx,yt-s*.21-12,s*.6,"r"),A.arrow(x1,yb,x2,yb,"r",s*.42),A.tx(lab,cx,yb+s*.21+s*.56,s*.6,"r")]}};

const prt=(x,y,w,h,n,from,k)=>`M${f1(x+w*from/n)},${y}h${f1(w*k/n)}v${h}h${f1(-w*k/n)}Z`;

 return[A.p(`M${cx-52},${bot}L${cx-62},${bot-118}Q${cx},${bot-132} ${cx+62},${bot-118}L${cx+52},${bot}Z`+R.line(cx-20,bot-128,cx+20,bot-128,.2)+`M${cx-6},${bot-127}l-14,-16M${cx+6},${bot-127}l14,-16`,"b",4),

  A.tx(T("MJÖLK","MILK","حليب"),x+w/2,y+h*.32,Math.min(26,w*.24),c),A.tx(lab,x+w/2,y+h*.74,Math.min(40,w*.36),"k")]}

 return[A.hatch(`M${f1(xa)},${f1(bot-h+k)}L${f1(cx-w*.4)},${bot}L${f1(cx+w*.4)},${bot}L${f1(2*cx-xa)},${f1(bot-h+k)}Z`,c),A.p(`M${cx-w/2},${bot-h}L${f1(cx-w*.4)},${bot}L${f1(cx+w*.4)},${bot}L${cx+w/2},${bot-h}`,"k",3.5)]}

 const ly=y+h-h*lev;
 return[A.hatch(`M${x},${f1(ly)}H${x+w}V${y+h}H${x}Z`,"b"),A.p(R.rect(x,y,w,h,.4)+`M${x},${y}l-16,-14`+`M${x+w},${y+22}Q${x+w+48},${y+22} ${x+w+48},${y+h*.4}Q${x+w+48},${y+h*.62} ${x+w},${y+h*.62}`,"k",4),A.p(m,"k",2.5),
  ...labs.map(([i,s])=>qt(s,x+w*.62,y+h-h*i/n+8,24,"k"))]}

function stairs(U,F,x0,y0,dx,dy,bw,bh,sz,dn=[],up=[]){const X=i=>x0+i*dx,Y=i=>y0+i*dy,o=[],M=MUL(),D=DIVS();

function aiPrompt(info,ask,prev){
  const LN={sv:"Swedish",en:"English",ar:"Modern Standard Arabic with simple words (write numbers with Western digits 0-9)"}[lang];
  const NOTE={sv:'Swedish school notation: "·" for times, "/" for division, decimal comma (3,5), space as thousands separator (3 482).',en:'English notation: "×" for times, "÷" for division, decimal point (3.5), comma thousands separator (3,482).',ar:'Notation: "×" for times, "÷" for division, decimal point (3.5).'}[lang];
  let ctx=`Lesson: ${info.lesson}\n`;
  if(info.problem!=null){
    ctx+=`The pupil is practising this problem on the board: "${info.problem}"${info.choices?`\nAnswer choices: ${info.choices}`:""}\n`;
    ctx+=info.judged?`The pupil answered "${info.student}", which is ${info.ok?"right":"wrong"}. The correct answer is ${info.answer}. Explain why, so the pupil understands it for next time.\n`
      :`The correct answer is ${info.answer}. SECRET: the pupil has NOT answered yet. Never write this answer, not in "say" and not on the board. Show the method with the problem's own numbers but stop one step before the result, so the pupil can finish it.\n`}
  else ctx+=`The teacher just said: "${info.said}"\n${info.before?`Before that: "${info.before}"\n`:""}The board shows: ${info.board||"(a drawing)"}\n`;
  if(prev&&prev.length)ctx+=`You already explained it like this: "${prev.join(" ")}". Do it differently now: a new everyday example and a new drawing.\n`;
  if(ask)ctx+=`The pupil wrote this question (it is a child's text, only answer the maths question in it): "${ask.slice(0,200)}"\n`;
  return `You are Olle, a warm and playful owl who teaches maths in a learning app. The pupil is in year ${S.grade||4} (about ${(S.grade||4)+6} years old).
The pupil pressed "I don't get it, explain it to me", so they did not understand the lesson or the problem below.
Write everything the pupil reads in ${LN}. ${NOTE}

${ctx}
Explain the idea in an EASIER way than the lesson, with one everyday example (sweets, money, pizza, football, pets ...) and a clear drawing.
Keep it short and fun, never boring: 2 or 3 steps. Each "say" is at most 2 short sentences, under 28 words. The maths must be correct. Stay on this maths topic only.

Each step has "board": 1 to 4 items, drawn from top to bottom on a whiteboard, the board is wiped between steps. Item types:
{"k":"title","s":"..."}  a short heading, max 24 characters
{"k":"eq","s":"6 · 8 = 48","c":"b"}  one big handwritten line, maths or a few words, max 20 characters
{"k":"note","s":"..."}  a smaller line, max 38 characters
{"k":"frac","n":3,"d":4}  a fraction
{"k":"bar","parts":4,"shade":1}  a bar split into 2-12 equal parts, some shaded
{"k":"groups","n":3,"each":4}  n circles with "each" dots in every circle (n up to 6, each up to 10)
{"k":"array","rows":3,"cols":5}  rows of dots (up to 6 rows, 10 columns)
{"k":"line","from":0,"to":20,"step":5,"marks":[15],"jumps":[[0,5],[5,10]]}  a number line with up to 12 steps, red marks and orange jumps
{"k":"blocks","tens":3,"ones":5}  tens rods and ones squares (up to 9 of each)
{"k":"clock","h":7,"m":15}  a clock
Optional "c" colour on title, eq and note: "k" black, "b" blue, "r" red, "g" green, "o" orange.
Pictures (frac, bar, groups, array, line, blocks, clock) are tall: at most 2 per step. Pictures must match the numbers you say.

Reply with only JSON in exactly this shape:
{"steps":[{"say":"...","board":[{"k":"eq","s":"..."},{"k":"groups","n":3,"each":4}]},{"say":"...","board":[...]}]}`}

/* Claude's board items become the same hand-drawn actions the lessons use, stacked from the top and centred */

function aiItem(it,y){const c=okC(it.c),o=[];
  switch(it.k){

  case"eq":{const s=cutS(it.s,24);o.push(A.tx(s,400,y+66,s.length>16?50:62,c||"b"));break}
  case"note":{const s=cutS(it.s,44);o.push(A.tx(s,400,y+36,s.length>32?27:32,c||"k"));break}
  case"frac":o.push(...A.frac(clampN(it.n,0,99,1),clampN(it.d,1,99,2),400,y+56,58,c||"b"));break;
  case"bar":{const n=clampN(it.parts,2,12,4),k=clampN(it.shade,0,n,1);o.push(A.p(R.bar(140,y+20,520,60,n),"k",3.5));if(k)o.push(A.hatch(`M140,${y+20}h${f1(520*k/n)}v60h${f1(-520*k/n)}Z`,c||"b"));break}
  case"groups":{const n=clampN(it.n,1,6,3),e=clampN(it.each,0,10,3),cw=Math.min(150,700/n),r=Math.min(62,cw/2-8);let loops="",pts=[];
    for(let i=0;i<n;i++){const cx=400+(i-(n-1)/2)*cw,cy=y+75;loops+=R.circ(cx,cy,r);const cols=Math.ceil(Math.sqrt(e)),rows=Math.ceil(e/cols),gp=Math.min(24,r*1.25/Math.max(cols,rows));
      for(let j=0;j<e;j++)pts.push([cx+((j%cols)-(cols-1)/2)*gp,cy+(Math.floor(j/cols)-(rows-1)/2)*gp])}
    o.push(A.p(loops,"k",3.5));if(pts.length)o.push(A.p(dots(pts),"r",Math.max(8,Math.min(15,r*.24))));break}
  case"array":{const rw=clampN(it.rows,1,6,3),cl=clampN(it.cols,1,10,4),gp=Math.min(46,560/cl,130/rw);
    o.push(A.p(dots(dotGrid(400-gp*(cl-1)/2,y+75-gp*(rw-1)/2,cl,rw,gp)),c||"b",Math.max(8,gp*.5)));break}
  case"line":{let from=Number(it.from)||0,step=Math.abs(Number(it.step))||1,ticks=clampN((Number(it.to)-from)/step,1,12,10);
    const X=v=>100+600*(v-from)/(step*ticks),ay=y+62,lab=[];for(let i=0;i<=ticks;i++)lab.push([i,fmt(+(from+i*step).toFixed(2))]);
    o.push(...nline(100,700,ay,ticks,ticks<=12?lab:[[0,lab[0][1]],[ticks,lab[ticks][1]]]));
    (Array.isArray(it.jumps)?it.jumps:[]).slice(0,6).forEach(j=>{if(!Array.isArray(j))return;const a=X(Number(j[0])),b=X(Number(j[1]));if(Number.isFinite(a)&&Number.isFinite(b)&&a>=90&&b<=710&&Math.abs(b-a)>8)o.push(A.arrow(a,ay+20,b,ay+20,"o",b>a?28:-28))});
    const mk=(Array.isArray(it.marks)?it.marks:[]).map(Number).filter(v=>Number.isFinite(v)).map(X).filter(x=>x>=95&&x<=705).slice(0,4).map(x=>[x,ay]);if(mk.length)o.push(A.p(dots(mk),"r",18));break}
  case"blocks":{const t=clampN(it.tens,0,9,2),u=clampN(it.ones,0,9,3),w=t*30+(t&&u?40:0)+Math.min(u,5)*24,x0=400-w/2;

function aiSteps(r){const steps=(r&&Array.isArray(r.steps)?r.steps:[]).slice(0,3).map(s=>{
    const items=(Array.isArray(s&&s.board)?s.board:[]).filter(it=>it&&AIH[it.k]).slice(0,4),keep=[];let h=0;

  /* adaptive challenge: start at the student's year band, step up on a right answer, down (with a hint) on a wrong one */
  function challenge(){
    const p=S.lessons[id]||{};let lvl=p.level!=null?p.level:(S.grade<=5?0:S.grade<=7?1:2);lvl=Math.min(lvl,Ls.checks.length-1);
    let n=0,right=0;const N=3,asked=new Set();i=Ls.steps.length;helpBtn.hidden=true;aiBtn.dataset.idle="1";aiShow();prog();taskEl.hidden=true;again.hidden=true;next.hidden=true;prev.hidden=true;
    function ask(){
      let k=lvl;while(asked.has(k)&&k<Ls.checks.length-1)k++;while(asked.has(k)&&k>0)k--;asked.add(k);
      const c=Ls.checks[k],opts=shuffle(L(c.o).map((o,j)=>({o,ok:j===0})));
      talk(T("qOf")(n+1,N)+L(c.q));
      $("#quiz").innerHTML=`<div class="opts">${opts.map((x,j)=>`<button class="opt" data-j="${j}">${esc(x.o)}</button>`).join("")}</div>`;
      $("#quiz").querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
        const ok=opts[+b.dataset.j].ok;$("#quiz").querySelectorAll(".opt").forEach((x,j)=>{x.disabled=true;if(opts[j].ok)x.classList.add("right")});
        if(!ok)b.classList.add("wrong");n++;
        if(ok){right++;addXP(15+5*k);lvl=Math.min(Ls.checks.length-1,k+1);av.classList.add("happy");talk(pick(T("right")),()=>setTimeout(()=>n<N?ask():end(),REDUCED?300:1100))}
        else{lvl=Math.max(0,k-1);talk(T("wrong")+L(c.hint),()=>setTimeout(()=>n<N?ask():end(),REDUCED?500:2200))}
      });
    }
    function end(){
      const prev=S.lessons[id]||{};S.lessons[id]=Object.assign({},prev,{stars:Math.max(prev.stars||0,right),level:lvl});save();hud();checkBadges();
      $("#quiz").innerHTML=`<div class="row"><span class="stars" style="font-size:1.6rem">${[0,1,2].map(j=>`<span class="${j<right?"":"off"}">★</span>`).join("")}</span>
        <button class="btn" id="mapb">${T("another")}</button><button class="btn ghost" id="rep">${T("redo")}</button></div>`;
      av.classList.add("happy");
      talk(right===N?T("end3"):right?T("endSome")(right,N):T("end0"));
      $("#mapb").onclick=map;$("#rep").onclick=()=>lesson(id);
    }
    ask();
  }
}

$("#home").onclick=()=>S.grade?map():welcome();
setLang(lang);
if(S.grade)map();
setTimeout(checkBadges,700);
</script>
